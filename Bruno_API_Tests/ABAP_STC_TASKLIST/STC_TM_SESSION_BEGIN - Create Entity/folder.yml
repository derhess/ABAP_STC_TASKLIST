    ```

    ## Called Function Module 

    FUNCTION stc_tm_session_begin>
    IMPORTING
    	VALUE(i_scenario_id) TYPE stc_scenario_id
    	VALUE(i_template_id) TYPE stc_template_id OPTIONAL
    	VALUE(i_init_only) TYPE sap_bool OPTIONAL
    	VALUE(i_ignore_langu_diff) TYPE sap_bool OPTIONAL
    	VALUE(i_ignore_scenario_diff) TYPE sap_bool OPTIONAL
    	VALUE(i_ignore_scenario_obsolete) TYPE sap_bool OPTIONAL
    	VALUE(it_parameter) TYPE stctm_tx_value OPTIONAL
    	VALUE(is_exec_settings) TYPE stc_exec_settings OPTIONAL
    	VALUE(is_caller_info) TYPE stc_ext_caller_info OPTIONAL
    EXPORTING
    	VALUE(e_session_id) TYPE stc_session_id
    	VALUE(e_status) TYPE stc_session_status
    	VALUE(e_status_descr) TYPE stc_session_status_descr
    	VALUE(e_finalized) TYPE stc_session_finalized
    	VALUE(e_exec_id) TYPE stc_exec_id
    TABLES
    	et_return TYPE bapirettab OPTIONAL.

