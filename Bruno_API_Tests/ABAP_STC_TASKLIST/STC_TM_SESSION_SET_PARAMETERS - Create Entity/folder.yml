    ## Called Function Module

    <span>FUNCTION stc_tm_session_set_parameters</span>

    <span> IMPORTING</span>

    <span> VALUE(i_session_id) TYPE stc_session_id</span>

    <span> VALUE(i_language) TYPE laiso OPTIONAL</span>

    <span> VALUE(i_ignore_langu_diff) TYPE sap_bool OPTIONAL</span>

    <span> VALUE(i_ignore_scenario_diff) TYPE sap_bool DEFAULT 'X'</span>

    <span> VALUE(it_parameter) TYPE stctm_tx_value</span>

