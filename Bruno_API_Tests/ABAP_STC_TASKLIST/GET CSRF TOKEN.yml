info:
  name: GET CSRF TOKEN
  type: http
  seq: 3

http:
  method: GET
  url: "{{protocol}}://{{host}}:{{port}}/sap/opu/odata/sap/ZSTC_TM_TASKLIST_SRV/$metadata"
  headers:
    - name: x-csrf-token
      value: fetch
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setCollectionVar("CSRF-TOKEN",res.getHeader("x-csrf-token"))

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
